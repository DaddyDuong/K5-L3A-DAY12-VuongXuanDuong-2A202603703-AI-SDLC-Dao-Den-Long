<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đảo Đèn Lồng</title>
    <style>
      /* Palette (Ticket-02): UI text #F5F1E6, danger #FF5A5F, gold/score #F2C14E, sky #0E1430, fog #1B2350 */
      :root {
        --text: #f5f1e6;
        --danger: #ff5a5f;
        --gold: #f2c14e;
        --sky: #0e1430;
        --fog: #1b2350;
        --lit: #ffb347;
        --mote: #fff6c2;
        --halo: #ffe58a;
        --red: #c8102e;
        --panel: rgba(14, 20, 48, 0.86);
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); color: var(--text);
                   font-family: "Segoe UI", system-ui, sans-serif; user-select: none; }
      canvas { display: block; }
      .hidden { display: none !important; }
      body.hit::after { content: ""; position: fixed; inset: 0; pointer-events: none;
                        box-shadow: inset 0 0 160px rgba(255, 90, 95, 0.75); animation: hit 0.45s ease-out forwards; }
      @keyframes hit { to { opacity: 0; } }

      /* ---------- HUD ---------- */
      #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 1px 3px #000a; }
      #flames { position: absolute; top: 14px; left: 16px; display: flex; gap: 6px; }
      .flame { width: 26px; height: 34px; }
      .flame path { fill: #ff7a2f; filter: drop-shadow(0 0 6px #ffb347); }
      .flame .inner { fill: #ffe9b0; }
      .flame.off path { fill: #3a3450; filter: none; }
      .flame.off .inner { fill: #2a2440; }
      #timer { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 34px;
               font-weight: 700; letter-spacing: 2px; font-variant-numeric: tabular-nums; }
      #timer.low { color: var(--danger); animation: blink 1s steps(2, start) infinite; }
      @keyframes blink { 50% { opacity: 0.25; } }
      #stats { position: absolute; top: 14px; right: 16px; text-align: right; font-size: 18px; line-height: 1.35; }
      #stats .lbl { opacity: 0.7; font-size: 13px; margin-right: 6px; }
      #score { color: var(--gold); font-weight: 700; font-size: 22px; }
      #motebar { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px;
                 padding: 6px 8px; border-radius: 10px; background: rgba(14, 20, 48, 0.55); }
      #motebar i { width: 18px; height: 18px; border-radius: 50%; border: 1px solid #ffe58a55; background: #ffffff10; }
      #motebar i.full { background: radial-gradient(circle, var(--mote) 0 35%, var(--halo) 60%, #ffe58a00 72%);
                        border-color: var(--halo); box-shadow: 0 0 8px var(--halo); }
      #cooldowns { position: absolute; bottom: 18px; right: 18px; display: flex; gap: 10px; }
      .cd { --p: 1; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; position: relative;
            background: conic-gradient(#ffb34799 calc(var(--p) * 360deg), #ffffff14 0); font-size: 11px; }
      .cd::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: rgba(14, 20, 48, 0.9); }
      .cd span { position: relative; text-align: center; line-height: 1.1; opacity: 0.55; }
      .cd.ready span { opacity: 1; }
      .cd.ready { box-shadow: 0 0 10px #ffb34788; }
      .cd.charm { background: conic-gradient(var(--red) 360deg, #0000 0); }
      .cd b { display: block; font-size: 15px; }
      #prompt { position: absolute; bottom: 74px; left: 50%; transform: translateX(-50%); padding: 7px 14px;
                border-radius: 8px; background: rgba(14, 20, 48, 0.75); border: 1px solid var(--lit); font-size: 17px;
                opacity: 0; transition: opacity 0.15s; }
      #prompt.show { opacity: 1; }
      #arrow { position: absolute; top: 0; left: 0; width: 0; height: 0; opacity: 0; }
      #arrow.show { opacity: 1; }
      #arrow::before { content: ""; position: absolute; left: -14px; top: -11px; border-left: 28px solid var(--lit);
                       border-top: 11px solid transparent; border-bottom: 11px solid transparent;
                       filter: drop-shadow(0 0 6px var(--lit)); }
      #banner { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 8px;
                background: rgba(14, 20, 48, 0.7); font-size: 16px; opacity: 0; transition: opacity 0.25s; }
      #banner.show { opacity: 1; }
      #banner.danger { color: var(--danger); }
      #motebar.wide i { width: 13px; height: 13px; }
      #carry { position: absolute; bottom: 52px; left: 50%; transform: translateX(-50%); font-size: 13px; opacity: 0.85;
               font-variant-numeric: tabular-nums; }
      /* Ticket-03 §6 "Bảng màu dễ phân biệt": danger text becomes #FFFFFF and always carries a ⚠ icon. */
      body.cb { --danger: #ffffff; }
      body.cb #timer.low::before, body.cb #banner.danger::before, body.cb .result.lost h1::before { content: "⚠ "; }
      .settings label.check { display: flex; gap: 10px; align-items: center; }
      #tag { position: absolute; bottom: 6px; left: 12px; font-size: 11px; opacity: 0.5; }
      #fps { position: fixed; top: 54px; left: 16px; font: 12px ui-monospace, monospace; background: #000a; padding: 3px 6px;
             border-radius: 4px; z-index: 5; }

      /* ---------- screens ---------- */
      #screen { position: fixed; inset: 0; display: grid; place-items: center;
                background: radial-gradient(ellipse at center, rgba(14, 20, 48, 0.25), rgba(14, 20, 48, 0.7)); }
      .panel { min-width: 340px; max-width: 560px; padding: 28px 34px; border-radius: 14px; background: var(--panel);
               border: 1px solid #f2c14e44; box-shadow: 0 10px 40px #0008; text-align: center; }
      .panel h1 { margin: 6px 0 10px; font-size: 38px; color: var(--lit); text-shadow: 0 0 22px #ffb34766; }
      .panel .eyebrow { text-transform: uppercase; letter-spacing: 3px; font-size: 12px; color: var(--gold); }
      .panel .sub { opacity: 0.8; margin: 4px 0 16px; }
      .panel .keys { font-size: 12px; opacity: 0.65; margin-top: 18px; line-height: 1.6; }
      .panel blockquote { margin: 8px 0 14px; font-style: italic; line-height: 1.55; font-size: 16px; }
      .panel cite { display: block; margin-top: 6px; font-style: normal; color: var(--gold); font-size: 14px; }
      .panel button { display: block; width: 100%; margin: 8px 0; padding: 10px 14px; border-radius: 9px;
                      border: 1px solid #f2c14e55; background: #ffffff0d; color: var(--text); font-size: 16px; cursor: pointer; }
      .panel button:hover { background: #f2c14e22; }
      .panel button.primary { background: var(--lit); color: #2a1a08; font-weight: 700; border-color: var(--lit); }
      .panel button.primary:hover { filter: brightness(1.08); }
      .panel .row { display: flex; gap: 8px; }
      .panel .row button { font-size: 13px; }
      .panel table { width: 100%; border-collapse: collapse; margin: 6px 0 16px; }
      .panel td { padding: 5px 4px; border-bottom: 1px solid #ffffff14; text-align: left; }
      .panel td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
      .panel tr.total td { font-weight: 700; color: var(--gold); font-size: 18px; border-bottom: none; }
      .result.lost h1 { color: var(--danger); text-shadow: 0 0 22px #ff5a5f55; }
      .settings label { display: block; text-align: left; margin: 14px 0; }
      .settings output { float: right; color: var(--gold); }
      .settings input { width: 100%; accent-color: var(--lit); }
      body.dawn #screen { background: linear-gradient(to top, #ffb347cc, #ff8a5c88 35%, #1b235055); }
    </style>
  </head>
  <body>
    <div id="hud" class="hidden">
      <div id="flames"></div>
      <div id="timer">05:00</div>
      <div id="stats">
        <div><span class="lbl">Đèn sáng</span><span id="lanterns">0/5</span></div>
        <div><span class="lbl">Điểm</span><span id="score">0</span></div>
      </div>
      <div id="banner"></div>
      <div id="prompt"></div>
      <div id="arrow"></div>
      <div id="carry"></div>
      <div id="motebar"></div>
      <div id="cooldowns">
        <div class="cd" id="cd-dash"><span><b>Shift</b>Lướt</span></div>
        <div class="cd" id="cd-pulse"><span><b>F</b>Tỏa sáng</span></div>
      </div>
      <div id="tag"></div>
    </div>
    <div id="fps" class="hidden"></div>
    <div id="screen" class="hidden"></div>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
