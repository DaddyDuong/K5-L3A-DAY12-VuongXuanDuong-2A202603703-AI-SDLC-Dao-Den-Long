<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đảo Đèn Lồng</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0614; font-family: system-ui, sans-serif; }
      #hud { position: fixed; top: 12px; left: 12px; color: #ffd9a0; font-size: 15px; line-height: 1.5;
             background: rgba(20, 8, 30, 0.6); padding: 8px 12px; border-radius: 8px; pointer-events: none; }
      #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                 flex-direction: column; color: #ffe2b0; text-align: center; pointer-events: none; }
      #overlay h1 { font-size: 40px; margin: 0 0 8px; text-shadow: 0 0 18px #ff9a3c; }
      #help { position: fixed; bottom: 12px; left: 12px; color: #c9b6e6; font-size: 13px; opacity: 0.8; }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="overlay"></div>
    <div id="help">WASD di chuyển · Chuột/←→ xoay camera · Space nhảy · E nạp đèn · F tỏa sáng · R chơi lại · Click để khóa chuột</div>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
